# Rime schema
# encoding: utf-8

__include: luna_pinyin.schema:/

__patch:
  - switches/@2/reset: 1
  - switches/+:
      - name: language_input_gloss
        reset: 1
        states: [ 译注显示：关, 译注显示：开 ]
      - name: language_input_ai
        reset: 0
        states: [ 翻译来源：词典, 翻译来源：AI ]
      - name: language_input_model_m2m100
        reset: 0
        states: [ AI 模型：QuickMT, AI 模型：M2M100 418M ]
      - options:
          - language_input_en
          - language_input_ja
          - language_input_es
        reset: 0
        states: [ 目标语言：英语, 目标语言：日语, 目标语言：西班牙语 ]
      - name: language_input_speech
        reset: 1
        states: [ 朗读：关, 朗读：开 ]
  - engine/filters/+:
      - lua_filter@*language_input.gloss_filter
  - language_input_pinyin.custom:/patch?

schema:
  schema_id: language_input_pinyin
  name: 译注全拼
  version: "0.2.0"
  author:
    - Language Input contributors
    - 佛振 <chen.sst@gmail.com> (朙月拼音)
  description: |
    简体中文全拼候选，附可关闭的外语短释义。

translator:
  prism: language_input_pinyin

menu:
  page_size: 9

language_input:
  gloss_language: en
  gloss_pack: language_input/gloss/en.tsv
  gloss_normalizer: t2s.json

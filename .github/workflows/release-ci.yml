name: Package Language Input

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      boost_version: 1.84.0
      RELEASE_BUILD: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set package version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Invalid package tag: $env:GITHUB_REF_NAME"
            }
            $version = $Matches[1]
            git fetch origin main --no-tags
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main.' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main.' }
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Package version: $version"

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure VS 2022 build
        shell: pwsh
        run: Copy-Item -LiteralPath env.vs2022.bat -Destination env.bat -Force

      - name: Cache Boost libraries
        id: boost-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BOOST_ROOT }}
          key: windows-2022-boost-1.84.0-msvc-14.3-x86-x64-v1

      - name: Download and build Boost
        if: steps.boost-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path deps -Force | Out-Null
          $archive = Join-Path $PWD 'deps\boost_1_84_0.7z'
          Invoke-WebRequest 'https://archives.boost.io/release/1.84.0/source/boost_1_84_0.7z' -OutFile $archive
          & 7z x $archive "-o$PWD\deps" -y
          if ($LASTEXITCODE -ne 0) { throw 'Boost extraction failed.' }
          & cmd.exe /d /c 'call build.bat boost'
          if ($LASTEXITCODE -ne 0) { throw 'Boost build failed.' }
          if (-not (Test-Path -LiteralPath "$env:BOOST_ROOT\stage\lib" -PathType Container)) {
            throw 'Boost build did not produce libraries.'
          }

      - name: Save Boost cache
        if: steps.boost-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BOOST_ROOT }}
          key: windows-2022-boost-1.84.0-msvc-14.3-x86-x64-v1

      - name: Apply input method patch to librime
        shell: pwsh
        run: |
          git -C librime apply --check ..\patches\librime-sensitive-mode.patch
          if ($LASTEXITCODE -ne 0) { throw 'librime patch no longer applies.' }
          git -C librime apply ..\patches\librime-sensitive-mode.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not patch librime.' }

      - name: Build Rime engine
        shell: pwsh
        run: |
          & cmd.exe /d /c 'call build.bat release rime'
          if ($LASTEXITCODE -ne 0) { throw "Rime build failed: $LASTEXITCODE" }
          foreach ($path in @('output\rime.dll', 'output\Win32\rime.dll')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing Rime output: $path" }
          }

      - name: Build data and Weasel
        shell: pwsh
        run: |
          & cmd.exe /d /c 'call build.bat release data opencc weasel'
          if ($LASTEXITCODE -ne 0) { throw "Weasel build failed: $LASTEXITCODE" }
          foreach ($path in @('output\rime.dll', 'output\WeaselServer.exe', 'output\WeaselSetup.exe', 'output\Win32\rime.dll', 'output\Win32\WeaselServer.exe', 'output\data\default.yaml')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing native output: $path" }
          }

      - name: Build local translation host
        shell: pwsh
        run: |
          python -m venv tools\model-host\.venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create model-host venv.' }
          & .\tools\model-host\build.ps1

      - name: Build settings application
        shell: pwsh
        run: |
          python -m venv settings-app\.venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create settings venv.' }
          $python = '.\settings-app\.venv\Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check -e .\settings-app 'PySide6-Essentials==6.11.2' 'ruamel.yaml==0.19.1' 'pypinyin==0.55.0' 'PyInstaller==6.22.3'
          if ($LASTEXITCODE -ne 0) { throw 'Could not install settings dependencies.' }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Settings dependency conflict.' }
          & .\settings-app\packaging\build.ps1
          if (-not (Test-Path -LiteralPath 'settings-app\dist\LanguageInputSettings\LanguageInputSettings.exe' -PathType Leaf)) {
            throw 'Settings executable was not built.'
          }
          & $python -m language_input_settings --gui-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Settings GUI smoke check failed.' }

      - name: Stage and create single installer
        shell: pwsh
        run: .\scripts\package_release.ps1 -Version $env:PACKAGE_VERSION

      - name: Check installer payload
        shell: pwsh
        run: |
          $installer = "output\archives\LanguageInput-$env:PACKAGE_VERSION-Windows-x64.exe"
          $listing = & 7z l -slt $installer
          if ($LASTEXITCODE -ne 0) { throw 'Could not list installer payload.' }
          foreach ($name in @('WeaselServer.exe', 'LanguageInputModelHost.exe', 'LanguageInputSettings.exe', 'icon.ico', 'download-sources.json')) {
            if (-not ($listing | Select-String -SimpleMatch $name -Quiet)) { throw "Installer is missing $name" }
          }
          $expected = Get-Content output\archives\SHA256SUMS.txt -Raw
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expected.StartsWith($hash)) { throw 'Installer checksum mismatch.' }

      - name: Upload downloadable package
        uses: actions/upload-artifact@v7
        with:
          name: LanguageInput-${{ env.PACKAGE_VERSION }}-Windows
          if-no-files-found: error
          path: |
            output/archives/LanguageInput-${{ env.PACKAGE_VERSION }}-Windows-x64.exe
            output/archives/SHA256SUMS.txt
            output/archives/RELEASE-NOTES.md

      - name: Prepare draft GitHub Release for tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: output/archives/RELEASE-NOTES.md
          files: |
            output/archives/LanguageInput-${{ env.PACKAGE_VERSION }}-Windows-x64.exe
            output/archives/SHA256SUMS.txt
